name: crux-mir-native-x86

# Native x86_64 runner only. Apple Silicon + Rosetta is NOT supported.
on:
  workflow_dispatch:
  push:
    paths:
      - 'formal/crux/**'
      - '.github/workflows/crux-mir.yml'

jobs:
  crux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Compile Rust to MIR JSON (mir-json image)
        run: |
          docker pull ghcr.io/galoisinc/mir-json:nightly
          docker run --rm \
            -v "$PWD/formal/crux:/work:rw" -w /work \
            --entrypoint /home/mir-json/.cargo/bin/crux-rustc \
            ghcr.io/galoisinc/mir-json:nightly /work/simple.rs
          ls -la formal/crux
      - name: Crux-MIR symbolic execution
        run: |
          docker pull ghcr.io/galoisinc/crux-mir:0.12
          docker run --rm \
            -v "$PWD/formal/crux:/work:rw" -w /work \
            ghcr.io/galoisinc/crux-mir:0.12 crux-mir /work/simple.mir
