name: crux-mir-native-x86

# Native x86_64 runner only. Apple Silicon + Rosetta is NOT supported.
on:
  workflow_dispatch:
  push:
    paths:
      - 'formal/crux/**'
      - '.github/workflows/crux-mir.yml'

jobs:
  crux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: cargo crux-test (native x86_64)
        run: |
          docker pull ghcr.io/galoisinc/crux-mir:0.12
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e RUSTUP_HOME=/home/crux-mir/.rustup -e CARGO_HOME=/tmp/cargo \
            -e CRUX_RUST_LIBRARY_PATH=/crux-mir/rlibs \
            -e RUSTFLAGS='--extern crucible=/crux-mir/rlibs/libcrucible.rlib' \
            -e PATH=/home/crux-mir/.cargo/bin:/usr/local/bin:/usr/bin:/bin \
            -v "$PWD/formal/crux:/work:rw" -w /work \
            --entrypoint /bin/sh \
            ghcr.io/galoisinc/crux-mir:0.12 -c 'cargo crux-test --lib'
